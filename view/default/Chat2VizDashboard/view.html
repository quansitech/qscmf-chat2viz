<extend name="Admin@default/common/dashboard_layout" />

<block name="content">
    <section class="content-header clearfix">
        <h1 class="pull-left">{$meta_title}</h1>
    </section>
    <section class="content">
        <div id="dashboard-view-app"></div>
    </section>
</block>

<block name="script">
    <link rel="stylesheet" href="__PUBLIC__/chat2viz-dashboard/dashboard-view.css?v=3">
    <style>
    /* P1-2: Hide admin chrome on the public view page so visitors don't see
       the backend navigation/sidebar. The view page extends dashboard_layout
       (which includes header+sidebar) for framework compatibility, but the
       public audience should only see the chart content. */
    body.chat2viz-public-view .navbar,
    body.chat2viz-public-view .navbar-static-top,
    body.chat2viz-public-view aside.main-sidebar,
    body.chat2viz-public-view .main-sidebar,
    body.chat2viz-public-view .left-side,
    body.chat2viz-public-view .wrapper > .header,
    body.chat2viz-public-view .wrapper > .navbar { display: none !important; }
    body.chat2viz-public-view .wrapper { margin: 0 !important; }
    body.chat2viz-public-view .right-side { margin-left: 0 !important; }
    </style>
    <script src="https://unpkg.com/@antv/g2@5/dist/g2.min.js"></script>
    <script>
    // Tag body for CSS-based admin chrome hiding
    document.body.className += ' chat2viz-public-view';
    </script>
    <!-- deepNormalize / PatchedChart removed (spec-typed-contract Phase C):
         specs are validated at commit_widget ingress; no heal-on-read needed. -->
    <script>var __PAGE_DATA__ = {:json_encode(['dashboard' => $dashboard, 'schema' => $schema, 'show_sql' => $show_sql])};</script>
    <script src="__PUBLIC__/chat2viz-dashboard/dashboard-view.js?v=10"></script>
</block>
